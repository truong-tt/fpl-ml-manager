name: Season Replay

# Manually triggered season-long replay. Walks the model GW-by-GW
# from `start_gw`, accumulates actual FPL points scored by chosen XI +
# captain. Output published to job summary and committed to the repo.
on:
  workflow_dispatch:
    inputs:
      start_gw:
        description: 'Start GW (1 = full season)'
        default: '1'
        required: false
      end_gw:
        description: 'End GW (blank = last finished)'
        default: ''
        required: false
      season:
        description: 'Season label (e.g. 2025-2026)'
        default: '2025-2026'
        required: false
      budget:
        description: 'Initial budget (£m)'
        default: '100'
        required: false

permissions:
  contents: write

concurrency:
  group: fpl-replay
  cancel-in-progress: false

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Refresh data + train models
        # Reuses production pipeline. Skips internal _gw_in_play guard
        # because we want models fresh against committed CSVs.
        run: python -u src/main.py || true

      - name: Run season replay
        run: |
          ARGS="--start ${{ inputs.start_gw }} --season ${{ inputs.season }} --budget ${{ inputs.budget }}"
          if [ -n "${{ inputs.end_gw }}" ]; then
            ARGS="$ARGS --end ${{ inputs.end_gw }}"
          fi
          python -u src/season_replay.py $ARGS

      - name: Publish replay to Job Summary
        run: cat data/processed/season_replay.md >> $GITHUB_STEP_SUMMARY

      - name: Commit + push results
        run: |
          git config --global user.name "Replay Bot"
          git config --global user.email "bot@noreply.github.com"
          git add -f data/processed/season_replay.md data/processed/season_replay.csv
          git diff --staged --quiet || git commit -m "Season replay $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
