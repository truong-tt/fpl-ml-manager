name: Season Replay

# Auto-runs after FPL Daily Update succeeds. Detects newly finalized
# GW from data/fixtures.csv (every fixture row with event==N must be
# finished and data_checked — naturally handles DGW where one event has >10 fixtures
# and BGW where it has <10). Skips when no new GW has finalized since
# last replay. Also manually dispatchable.
on:
  workflow_run:
    workflows: ["FPL Daily Update"]
    types: [completed]
  workflow_dispatch:
    inputs:
      start_gw:
        description: 'Start GW (1 = full season)'
        default: '1'
        required: false
      end_gw:
        description: 'End GW (blank = last finalized)'
        default: ''
        required: false
      season:
        description: 'Season label (e.g. 2026-2027)'
        default: '2026-2027'
        required: false
      budget:
        description: 'Initial budget (£m)'
        default: '100'
        required: false
      force:
        description: 'Force run even if no new finalized GW'
        default: 'false'
        required: false

permissions:
  contents: write

concurrency:
  group: fpl-data-writer
  cancel-in-progress: false

env:
  SEASON: ${{ github.event.inputs.season || '2026-2027' }}
  START_GW: ${{ github.event.inputs.start_gw || '1' }}
  END_GW: ${{ github.event.inputs.end_gw || '' }}
  BUDGET: ${{ github.event.inputs.budget || '100' }}
  FORCE: ${{ github.event.inputs.force || 'false' }}

jobs:
  replay:
    # workflow_run fires on any conclusion; only proceed if upstream succeeded.
    # Manual dispatch always proceeds.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # workflow_run runs against the workflow file on the default branch
          # but checks out that commit by default — explicit ref keeps us on
          # main where the pipeline just pushed fresh fixtures.csv.
          ref: main

      - name: Detect newly finalized GW
        id: gw
        run: python3 src/workflow_gate.py replay

      - name: Set up Python
        if: steps.gw.outputs.should_run == 'true'
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        if: steps.gw.outputs.should_run == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Skip — no new finalized GW
        if: steps.gw.outputs.should_run != 'true'
        run: |
          echo "No new finalized GW since last replay (last_finalized=${{ steps.gw.outputs.last_finalized }}, last_replayed=${{ steps.gw.outputs.last_replayed }}). Skipping."

      - name: Run season replay
        if: steps.gw.outputs.should_run == 'true'
        run: |
          ARGS="--start ${START_GW} --season ${SEASON} --budget ${BUDGET}"
          if [ -n "${END_GW}" ]; then
            ARGS="$ARGS --end ${END_GW}"
          fi
          python -u src/season_replay.py $ARGS

      - name: Publish replay to Job Summary
        if: steps.gw.outputs.should_run == 'true'
        run: cat data/processed/season_replay.md >> $GITHUB_STEP_SUMMARY

      - name: Commit + push results
        if: steps.gw.outputs.should_run == 'true'
        # Both data writers share one concurrency group. Rebase-and-retry still
        # protects against unrelated commits landing during a manual run.
        run: |
          set -e
          git config --global user.name "Replay Bot"
          git config --global user.email "bot@noreply.github.com"
          git add -f data/processed/season_replay.md data/season_replay.csv
          if git diff --staged --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Season replay $(date -u +'%Y-%m-%d %H:%M UTC')"
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash origin main && git push && exit 0
            echo "Push attempt $i failed; retrying after backoff."
            sleep $((i * 5))
          done
          echo "Push failed after retries." >&2
          exit 1
