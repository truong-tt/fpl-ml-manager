name: Source Health

on:
  workflow_dispatch:
  schedule:
    - cron: '45 6 * * *'

permissions:
  contents: read

jobs:
  current-season:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Verify current-season sources and normalization
        run: python -u src/source_check.py
