name: FPL Weekly Update

on:
  schedule:
    - cron: '0 10 * * 3'  # Every Wednesday at 10:00 UTC
  workflow_dispatch:      # Manual trigger

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Update Data
      run: python src/data_loader.py

    - name: Run Optimization & Show Lineup
      run: |
        # 1. Run the AI and capture output to a file AND console
        python src/main.py > lineup_output.txt
        cat lineup_output.txt

        # 2. Add a title to the GitHub Summary Page
        echo "## FPL AI Weekly Lineup" >> $GITHUB_STEP_SUMMARY
        
        # 3. Add the lineup inside a code block so it looks like a table
        echo '```text' >> $GITHUB_STEP_SUMMARY
        cat lineup_output.txt >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY

    - name: Commit and Push Changes
      run: |
        git config --global user.name "FPL Bot"
        git config --global user.email "bot@noreply.github.com"
        # Force add the squad file specifically to ensure it's tracked
        git add data/processed/optimal_squad_live.csv
        git add data/processed/*.csv
        # Commit if there are changes
        git diff --staged --quiet || git commit -m "Auto-update: Optimized Squad for GW $(date +'%Y-%m-%d')"
        git push