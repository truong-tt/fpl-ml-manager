name: FPL Weekly Update

# Trigger: Runs every Wednesday at 10:00 UTC

on:
  schedule:
    - cron: '0 10 * * 3'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Update Data
      run: python src/data_loader.py

    - name: Run Optimization
      run: python src/main.py

    - name: Commit and Push Changes
      run: |
        git config --global user.name "FPL Bot"
        git config --global user.email "bot@noreply.github.com"
        git add data/processed/*.csv
        git commit -m "Auto-update: Optimized Squad for upcoming GW" || echo "No changes to commit"
        git push