name: FPL Weekly Update

on:
  schedule:
    - cron: '0 10 * * 3'  # Every Wednesday at 10:00 UTC
  workflow_dispatch:      # Manual trigger

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4  # Updated to v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Update Data
      run: python src/data_loader.py

    - name: Run Optimization
      run: python src/main.py

    - name: Commit and Push Changes
      run: |
        git config --global user.name "FPL Bot"
        git config --global user.email "bot@noreply.github.com"
        git add data/processed/*.csv
        git diff --staged --quiet || git commit -m "Auto-update: Optimized Squad for GW $(date +'%Y-%m-%d')"
        git push