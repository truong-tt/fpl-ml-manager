name: FPL Daily Update

# Upstream FPL-Core-Insights dataset refreshes 2×/day at ~05:00 + 17:00 UTC.
# Run pipeline 30 min after each refresh to consume latest CSVs.
on:
  schedule:
    - cron: '30 5,17 * * *'  # 05:30 + 17:30 UTC daily
  workflow_dispatch:          # Manual trigger

permissions:
  contents: write

env:
  SEASON: '2025-2026'
  SEASON_END_GW: '38'

# Avoid concurrent runs racing on git push if 05:30 run still in flight.
concurrency:
  group: fpl-update
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Detect completed season
      id: season_gate
      run: |
        python3 - <<'PY'
        import csv
        import os
        from pathlib import Path

        season = os.environ["SEASON"]
        end_gw = int(os.environ["SEASON_END_GW"])
        fixtures = Path("data/fixtures.csv")
        last_fin = 0

        if fixtures.exists():
            events = {}
            with fixtures.open(newline="", encoding="utf-8") as fh:
                for row in csv.DictReader(fh):
                    if str(row.get("season", "")) != season:
                        continue
                    try:
                        event = int(float(row.get("event", "")))
                    except (TypeError, ValueError):
                        continue
                    fin = str(row.get("finished", "")).strip().lower() in {"true", "1", "yes"}
                    events.setdefault(event, []).append(fin)

            done = [gw for gw, flags in events.items() if flags and all(flags)]
            last_fin = max(done) if done else 0

        season_done = last_fin >= end_gw
        with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
            fh.write(f"last_fin={last_fin}\n")
            fh.write(f"season_done={'true' if season_done else 'false'}\n")
        print(f"last_fin={last_fin} season_done={season_done}")
        PY

    - name: Set up Python
      if: ${{ steps.season_gate.outputs.season_done != 'true' }}
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      if: ${{ steps.season_gate.outputs.season_done != 'true' }}
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run pipeline
      if: ${{ steps.season_gate.outputs.season_done != 'true' }}
      # main.py calls refresh_data() internally, trains any missing models,
      # auto-recalibrates points/minutes heads when JSON > RECALIB_STALE_DAYS,
      # runs the optimizer, writes data/processed/lineup.md.
      run: python src/main.py

    - name: Detect completed season after refresh
      id: post_gate
      if: ${{ steps.season_gate.outputs.season_done != 'true' }}
      run: |
        python - <<'PY'
        import csv
        import os
        from pathlib import Path

        season = os.environ["SEASON"]
        end_gw = int(os.environ["SEASON_END_GW"])
        fixtures = Path("data/fixtures.csv")
        last_fin = 0

        if fixtures.exists():
            events = {}
            with fixtures.open(newline="", encoding="utf-8") as fh:
                for row in csv.DictReader(fh):
                    if str(row.get("season", "")) != season:
                        continue
                    try:
                        event = int(float(row.get("event", "")))
                    except (TypeError, ValueError):
                        continue
                    fin = str(row.get("finished", "")).strip().lower() in {"true", "1", "yes"}
                    events.setdefault(event, []).append(fin)

            done = [gw for gw, flags in events.items() if flags and all(flags)]
            last_fin = max(done) if done else 0

        season_done = last_fin >= end_gw
        with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
            fh.write(f"last_fin={last_fin}\n")
            fh.write(f"season_done={'true' if season_done else 'false'}\n")
        print(f"last_fin={last_fin} season_done={season_done}")
        PY

    - name: Publish lineup to Job Summary
      if: ${{ steps.season_gate.outputs.season_done != 'true' && steps.post_gate.outputs.season_done != 'true' }}
      run: cat data/processed/lineup.md >> $GITHUB_STEP_SUMMARY

    - name: Commit and push changes
      if: ${{ steps.season_gate.outputs.season_done != 'true' }}
      # Season Replay workflow uses a different concurrency group, so its push
      # can land between our checkout and push. Rebase-and-retry on reject.
      run: |
        set -e
        git config --global user.name "FPL Bot"
        git config --global user.email "bot@noreply.github.com"

        # Data CSVs, model artifacts, recalib JSONs, snapshot, lineup report.
        git add -f data/*.csv data/*.json data/processed/lineup.md data/processed/squad_snapshot.csv 2>/dev/null || true

        if git diff --staged --quiet; then
          echo "No changes to commit."
          exit 0
        fi
        git commit -m "Pipeline run $(date -u +'%Y-%m-%d %H:%M UTC')"
        for i in 1 2 3 4 5; do
          git pull --rebase origin main && git push && exit 0
          echo "Push attempt $i failed; retrying after backoff."
          sleep $((i * 5))
        done
        echo "Push failed after retries." >&2
        exit 1
