name: FPL Daily Update

# Upstream FPL-Core-Insights dataset refreshes 2×/day at ~05:00 + 17:00 UTC.
# Run pipeline 30 min after each refresh to consume latest CSVs.
on:
  schedule:
    - cron: '30 5,17 * * *'  # 05:30 + 17:30 UTC daily
  workflow_dispatch:          # Manual trigger

permissions:
  contents: write

env:
  SEASON: '2026-2027'

# Avoid concurrent runs racing on git push if 05:30 run still in flight.
concurrency:
  group: fpl-data-writer
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Detect completed season
      id: season_gate
      run: python3 src/workflow_gate.py season

    - name: Set up Python
      if: ${{ steps.season_gate.outputs.season_done != 'true' }}
      uses: actions/setup-python@v7
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      if: ${{ steps.season_gate.outputs.season_done != 'true' }}
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run pipeline
      id: pipeline
      if: ${{ steps.season_gate.outputs.season_done != 'true' }}
      # main.py calls refresh_data() internally, trains any missing models,
      # auto-recalibrates points/minutes heads when JSON > RECALIB_STALE_DAYS,
      # runs the optimizer, writes data/processed/lineup.md.
      run: python src/main.py

    - name: Detect completed season after refresh
      id: post_gate
      if: ${{ steps.season_gate.outputs.season_done != 'true' }}
      run: python src/workflow_gate.py season

    - name: Publish lineup to Job Summary
      if: steps.pipeline.outputs.generated == 'true'
      run: cat data/processed/lineup.md >> $GITHUB_STEP_SUMMARY

    - name: Commit and push changes
      if: ${{ steps.season_gate.outputs.season_done != 'true' }}
      # Both data writers serialize on one concurrency group. Rebase-and-retry
      # still protects against unrelated commits landing during the run.
      run: |
        set -e
        git config --global user.name "FPL Bot"
        git config --global user.email "bot@noreply.github.com"

        # Data CSVs, model artifacts, recalib JSONs, snapshot, lineup report.
        shopt -s nullglob
        artifacts=(data/*.csv data/*.json)
        if [ "${{ steps.pipeline.outputs.generated }}" = "true" ]; then
          artifacts+=(data/processed/lineup.md data/processed/squad_snapshot.csv)
        fi
        if [ ${#artifacts[@]} -gt 0 ]; then
          git add -f -- "${artifacts[@]}"
        fi

        if git diff --staged --quiet; then
          echo "No changes to commit."
          exit 0
        fi
        git commit -m "Pipeline run $(date -u +'%Y-%m-%d %H:%M UTC')"
        for i in 1 2 3 4 5; do
          git pull --rebase --autostash origin main && git push && exit 0
          echo "Push attempt $i failed; retrying after backoff."
          sleep $((i * 5))
        done
        echo "Push failed after retries." >&2
        exit 1
