name: FPL Weekly Update

on:
  schedule:
    - cron: '0 10 * * 3'  # Every Wednesday at 10:00 UTC
  workflow_dispatch:       # Manual trigger

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run pipeline
      # main.py calls refresh_data() internally, trains any missing models,
      # runs the optimizer, and writes data/processed/lineup.md
      run: python src/main.py

    - name: Publish lineup to Job Summary
      run: cat data/processed/lineup.md >> $GITHUB_STEP_SUMMARY

    - name: Commit and push changes
      run: |
        git config --global user.name "FPL Bot"
        git config --global user.email "bot@noreply.github.com"

        # Data CSVs, model artifacts (.json / .joblib), squad snapshot, lineup report
        git add -f data/*.csv data/*.json data/processed/lineup.md data/processed/squad_snapshot.csv 2>/dev/null || true

        git diff --staged --quiet || git commit -m "GW update $(date +'%Y-%m-%d')"
        git push